# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The Gallai–Hasse–Roy–Vitaver theorem"
  description: >-
    A Lean 4 / Mathlib formalization of the Gallai–Hasse–Roy–Vitaver theorem: if an orientation of a
    finite graph has no directed path on more than k vertices, the graph is k-colourable; and
    conversely every k-colourable graph has such an orientation. Hence the chromatic number is the
    minimum over orientations of the number of vertices of a longest directed path.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C15", "05C20"]

sources:
  - title: "Nombre chromatique et plus longs chemins d'un graphe"
    authors:
      - "B. Roy"
    id: "doi:10.1051/m2an/1967010501291"
    type: "paper"
    location: "Revue française d'informatique et de recherche opérationnelle 1 (1967), 129–132"
    relationship: "formalizes"
    note: "Chromatic number at most the number of vertices of a longest directed path of any orientation."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Zur algebraischen Begründung der Graphentheorie. I"
    authors:
      - "M. Hasse"
    id: "doi:10.1002/mana.19650280503"
    type: "paper"
    location: "Mathematische Nachrichten 28 (1965), 275–290"
    relationship: "formalizes"
    note: "Independent discovery of the same theorem."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "On directed paths and circuits"
    authors:
      - "T. Gallai"
    type: "paper"
    location: "Theory of Graphs (Proc. Colloq. Tihany, 1966), Academic Press (1968), 115–118"
    relationship: "formalizes"
    note: "Independent discovery of the same theorem; no DOI."
    license: "unknown"
    author_endorsement: "n/a"

status:
  scope: >-
    Proved for finite simple graphs (any universe) and arbitrary orientations given as relations
    covering every edge in at least one direction; the converse for every k-colourable graph.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced the proofs in one run from the formal statements and a proof plan; the return was
        audited (statements and headers unchanged, no added axioms) and rebuilt locally.
      cost:
        wall_time: "under one hour"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plan supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design, proof plan, integration and review of the Aristotle return, and the
        Palomar packaging, checked with `lake build` and `#print axioms` (Lean v4.35.0-rc3,
        Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean proofs are AI-generated and mechanically
    verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound, identical
    elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    Orientations are relations o with every edge oriented in at least one direction and every arc
    an edge (both directions are allowed, which only strengthens the theorem); a directed path on
    m vertices is an injective map Fin m → V with an arc between consecutive vertices. The
    chromatic-number formulation is given by the two directions (colourability bound and
    converse).

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with the Gallai–Hasse–Roy–Vitaver theorem, checked that the Aristotle
    return left every statement and header unchanged, and confirmed by `lake build`,
    `#print axioms` and a comparison of the fully elaborated Challenge and Solution types that the
    proofs use no `sorry` and only propext, Classical.choice and Quot.sound. The author directed
    the work and approved the statements. No independent human mathematical review has been
    performed. The result is classical; no mathematical novelty is claimed.

alignment:
  namespace: "GallaiRoyTheorem"
  statements:
    - source: "Gallai–Hasse–Roy–Vitaver theorem"
      lean: "GallaiRoyTheorem.colorable_of_orientation"
      module: "Challenge"
      status: "proved"
    - source: "Converse (orientation by colours)"
      lean: "GallaiRoyTheorem.exists_orientation_of_colorable"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle.
